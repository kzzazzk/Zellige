name: Deploy private pilot

on:
  workflow_call:
    secrets:
      VERCEL_REPOSITORY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: pilot-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Update the private development pilot
    if: github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'minimal-mvp-chat-web')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pilot-development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Resolve the existing pilot deployment configuration
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PILOT_PROJECT_ID: ${{ vars.VERCEL_PILOT_PROJECT_ID }}
          VERCEL_PILOT_GATEWAY_DEPLOYMENT_ID: ${{ vars.VERCEL_PILOT_GATEWAY_DEPLOYMENT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_REPOSITORY_TOKEN }}
        run: node deploy/resolve-pilot.mjs
      - name: Check changes since this application was deployed
        id: scope
        env:
          DEPLOY_TARGET: pilot
          APPROVED_BRANCH: ${{ github.event.pull_request.base.ref }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PILOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_REPOSITORY_TOKEN }}
        run: node deploy/deployment-scope.mjs
      - name: Publish the exact branch commit approved by CI
        if: steps.scope.outputs.changed == 'true'
        env:
          APPROVED_BRANCH: ${{ github.event.pull_request.base.ref }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PILOT_PROJECT_ID: ${{ env.VERCEL_PILOT_PROJECT_ID }}
          VERCEL_PILOT_GATEWAY_DEPLOYMENT_ID: ${{ env.VERCEL_PILOT_GATEWAY_DEPLOYMENT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_REPOSITORY_TOKEN }}
        run: node deploy/publish-pilot.mjs
