name: SonarQube Cloud

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: SonarQube Cloud analysis
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN. Add an analysis token for zellige-oss to this repository's Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect coverage support
        id: coverage
        run: |
          if [ -f pyproject.toml ] && [ -d tests ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f web/package-lock.json ] && [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.coverage.outputs.python == 'true'
        with:
          version: "0.11.8"
          python-version: "3.12"
      - name: Produce coverage for the analyzed revision
        if: steps.coverage.outputs.python == 'true'
        run: |
          uv sync --locked --dev --no-install-project --no-build
          uv run --locked --no-sync --no-build coverage run -m unittest discover -s tests -v
          uv run --locked --no-sync --no-build coverage xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.coverage.outputs.web == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Produce frontend coverage for the analyzed revision
        if: steps.coverage.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci --ignore-scripts
          vitest_version=$(node -p "require('./node_modules/vitest/package.json').version")
          npm install --no-save --ignore-scripts "@vitest/coverage-v8@$vitest_version"
          npm test -- --coverage --coverage.reporter=lcov
      - name: Analyze the revision and check its quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: -Dsonar.branch.name=main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
