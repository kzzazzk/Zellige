name: CI pilot

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ci-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web lint, types, tests and build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated OpenAPI contract
        working-directory: .
        run: |
          uv sync --locked --dev
          ZELLIGE_PYTHON=.venv/bin/python npm --prefix web run api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check pilot publication and deployment selection
        working-directory: .
        run: node --test tests/resolve-pilot.test.mjs tests/publish-pilot.test.mjs tests/deployment-scope.test.mjs

  build:
    name: Build
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.12"
      - name: Check dependency lock
        run: uv lock --check
      - name: Build source distribution and wheel
        run: uv build --no-sources
      - name: Verify installed distributions include working migrations
        run: |
          for distribution in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$distribution" python -I -c '
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zellige.server import build_app
          with TemporaryDirectory() as directory:
              app = build_app(Path(directory), "distribution-test-token")
              assert app.state.service.database.quick_check() == "ok"
              assert "/v1/conversations" in app.openapi()["paths"]
          '
          done
      - name: Retain distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Tests
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.12"
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run tests with branch coverage
        run: uv run --locked coverage run -m unittest discover -s tests -v
      - name: Export coverage report
        run: |
          uv run --locked coverage xml
          uv run --locked coverage report
      - name: Retain coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: SonarQube Cloud analysis
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing SONAR_TOKEN. Add an analysis token for zellige-oss to this repository's Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.8"
          python-version: "3.12"
      - name: Produce backend coverage for the analyzed revision
        run: |
          uv sync --locked --dev --no-install-project --no-build
          uv run --locked --no-sync --no-build coverage run -m unittest discover -s tests -v
          uv run --locked --no-sync --no-build coverage xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Produce frontend coverage for the analyzed revision
        working-directory: web
        run: |
          npm ci --ignore-scripts
          vitest_version=$(node -p "require('./node_modules/vitest/package.json').version")
          npm install --no-save --ignore-scripts "@vitest/coverage-v8@$vitest_version"
          npm test -- --coverage --coverage.reporter=lcov
      - name: Analyze the revision and check its quality gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: -Dsonar.branch.name=main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  required:
    name: Pilot CI required
    if: ${{ always() && github.event.pull_request.merged == true }}
    needs: [web, build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required validations did not pass: " + ", ".join(failed))
          print("All required validations passed.")
          PYTHON

  publish:
    name: Deploy validated pilot
    needs: [required]
    if: github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'minimal-mvp-chat-web')
    uses: ./.github/workflows/cd.yml
    secrets:
      VERCEL_REPOSITORY_TOKEN: ${{ secrets.VERCEL_TOKEN }}
