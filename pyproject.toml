[project]
name = "zellige"
version = "0.1.0"
description = "Portable, self-hosted conversation daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
zellige = "zellige.server:main"
zellige-export-schemas = "zellige.adapter.web.dto.schema:export_schemas"
zellige-export-openapi = "zellige.server:export_openapi"

[tool.unittest]
start-directory = "tests"

[tool.mypy]
files = ["zellige"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true

[dependency-groups]
dev = [
    "coverage>=7.16.2,<8",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "ruff>=0.16,<0.17",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["zellige"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.hatch.build.targets.wheel]
packages = ["zellige"]

[tool.hatch.build.targets.wheel.force-include]
"db/migrations" = "zellige/migrations"
"db/schemas" = "zellige/schemas"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
