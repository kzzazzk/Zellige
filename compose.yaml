services:
  zellige:
    build: .
    restart: unless-stopped
    environment:
      ZELLIGE_API_TOKEN: ${ZELLIGE_API_TOKEN:?Set ZELLIGE_API_TOKEN}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - zellige-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  zellige-data:
