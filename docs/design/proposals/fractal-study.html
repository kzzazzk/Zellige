<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zellige — autosimilitud finita</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F8F6EF;color:#132D3C;font:15px system-ui}header{padding:28px 32px 20px}h1{margin:0;font-size:25px;letter-spacing:-.7px}header p{max-width:850px;line-height:1.6;color:#596871;margin:10px 0}main{padding:0 24px 24px;display:grid;grid-template-columns:1fr 1fr;gap:22px}figure{margin:0}svg{width:100%;display:block;aspect-ratio:1}figcaption{padding:14px 0;line-height:1.5}figcaption strong{display:block;margin-bottom:4px;font-weight:600}figcaption span{font-size:13px;color:#61717A}.single header,.single figcaption{display:none}.single main{display:block;padding:0}.single figure:not(:last-child){display:none}.single svg{height:100vh;width:100vw}.single{overflow:hidden}
</style>
<header><h1>Zellige · La misma forma, a dos escalas</h1><p>La estrella y los ocho pétalos conservan la lectura principal. El detalle pequeño subdivide las juntas azules sin cambiar el borde del módulo.</p></header>
<main></main>
<script type="module">
import {renderPattern} from './rosette.mjs';
const options=new URLSearchParams(location.search),material=options.has('material'),single=options.has('single'),count=Number(options.get('count')||3);
if(single)document.body.classList.add('single');
for(const depth of [0,1]){
 const figure=document.createElement('figure');
 figure.innerHTML=renderPattern({depth,count,material})+`<figcaption><strong>${depth?'02 · Autosimilitud controlada':'01 · Módulo principal'}</strong><span>${depth?'Una copia reducida de la misma construcción dentro de cada encuentro azul. Dos escalas, sin solapes nuevos.':'Estrella y rombos conservados; esquinas azules más pequeñas y pétalos conectados.'}</span></figcaption>`;
 document.querySelector('main').append(figure);
}
</script>
</html>
