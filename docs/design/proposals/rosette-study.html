<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zellige — estudio de la retícula</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d7;color:#102b35;font:16px system-ui}header{padding:24px 36px}h1{font-size:22px;margin:0 0 8px}p{margin:0;font-size:14px}.studies{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 24px 24px}figure{margin:0}svg{display:block;width:100%;aspect-ratio:1}figcaption{padding:10px 0;font-size:14px}
</style>
<header><h1>Zellige · Retícula y proporción</h1><p>Estrella conservada. Las piezas blancas y los encuentros azules forman una sola red.</p></header>
<main class="studies"></main>
<script>
const q=Math.SQRT2;
const star=[[0,-q],[q-1,-1],[1,-1],[1,1-q],[q,0],[1,q-1],[1,1],[q-1,1],[0,q],[1-q,1],[-1,1],[-1,q-1],[-q,0],[-1,1-q],[-1,-1],[1-q,-1]];
const rotate=([x,y],t)=>[x*Math.cos(t)-y*Math.sin(t),x*Math.sin(t)+y*Math.cos(t)];
function render(a,s,label){
 const step=2*a,e=a-s,count=3,ns='http://www.w3.org/2000/svg';
 const figure=document.createElement('figure'),svg=document.createElementNS(ns,'svg');
 svg.setAttribute('viewBox',`0 0 ${step*count} ${step*count}`);
 function poly(points,color,x,y){const node=document.createElementNS(ns,'polygon');node.setAttribute('points',points.map(([u,v])=>`${u+x},${v+y}`).join(' '));node.setAttribute('fill',color);node.setAttribute('stroke','#B9995F');node.setAttribute('stroke-width','.035');node.setAttribute('stroke-linejoin','round');svg.append(node);}
 const petal=e===1?[[q,0],[1,q-1],[1,1],[a,1]]:[[q,0],[1,q-1],[1,1],[e,e],[a,e],[a,1]];
 const diamond=[[q,0],[a,1],[2*a-q,0],[a,-1]];
 const square=[[a-s,a-s],[a+s,a-s],[a+s,a+s],[a-s,a+s]];
 for(let row=-1;row<=count;row++)for(let col=-1;col<=count;col++){
  const x=a+col*step,y=a+row*step;
  poly(star,'#0A5057',x,y);
  for(let n=0;n<4;n++){poly(petal.map(p=>rotate(p,n*Math.PI/2)),'#F4EDDD',x,y);poly(petal.map(([u,v])=>rotate([v,u],n*Math.PI/2)),'#F4EDDD',x,y);}
  poly(diamond,'#0E6B6A',x,y);poly(diamond.map(p=>rotate(p,Math.PI/2)),'#123D70',x,y);poly(square,'#173E69',x,y);
 }
 const caption=document.createElement('figcaption');caption.textContent=label;figure.append(svg,caption);document.querySelector('main').append(figure);
}
render(1+q,q,'A · Retícula anterior: grandes cuadrados (referencia rechazada)');
render(1.75,.75,'B · Compactación: conectores más estrechos');
render(1+q,.8,'C · Pétalos extendidos: rombos conservados, cuadrados pequeños');
render(2,.65,'D · Pétalos extendidos y escala compacta');
</script>
</html>
