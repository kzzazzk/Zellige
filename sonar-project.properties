sonar.projectKey=zellige-oss_Zellige
sonar.organization=zellige-oss
sonar.projectName=Zellige
sonar.sources=.
sonar.inclusions=zellige/**,app.py,web/src/**,.github/workflows/ci.yml
sonar.tests=.
sonar.exclusions=tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**,.runtime/**,.output/**
sonar.test.inclusions=tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
