# Connection and project identity are supplied through GitHub Actions variables.
sonar.projectName=Zellige
sonar.sources=zellige,app.py,Dockerfile,compose.yaml,web/src
sonar.tests=tests,web/src
sonar.exclusions=web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.test.inclusions=tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
