# Private pilot. No public bindings.
# Optional dedicated VPN ingress is defined separately in compose.tailscale.yaml.
name: zellige-lab
services:
  pilot:
    build: .
    image: zellige-pilot:local
    restart: unless-stopped
    env_file: .runtime/pilot.env
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - pilot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1.0
volumes:
  pilot-data:
